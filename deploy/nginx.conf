# Nginx site for tidewell.live (§2: Hostinger VPS, PM2, Nginx; §19: the domain).
#
# This file references TLS certificates, so it cannot be the FIRST config on a
# fresh server — nginx refuses to start when ssl_certificate points at a file
# that does not exist yet, and you cannot obtain a certificate without nginx
# answering on port 80. A fresh box goes through deploy/bootstrap.sh; a box
# moving to this domain goes through deploy/switch-domain.sh, which obtains the
# certificate first. deploy/deploy.sh refuses to install this file while any
# certificate it names is missing, for the same reason.
#
# It also uses $connection_upgrade, which is defined in
# deploy/upgrade-map.conf — drop that into /etc/nginx/conf.d/ or `nginx -t`
# fails with "unknown variable". Check nothing else on the box already defines
# it first: a duplicate `map` also fails the test, and on a shared server that
# takes every other site down on the next reload.
#
# The front end is :3000; the Fastify API is :3001, and /api/stream is a
# websocket that has to stay open for hours.
#
# The old domain, balast.xyz, 301s here: plain HTTP below, HTTPS from
# deploy/nginx-legacy.conf, which is installed only while its certificate is
# on the box.

server {
    listen 80;
    listen [::]:80;
    server_name tidewell.live www.tidewell.live;

    # ACME first, redirect second. If the challenge is redirected to HTTPS the
    # renewal fails, and a certificate that silently stops renewing takes the
    # whole front-end down 90 days later.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://tidewell.live$request_uri;
    }
}

# The old name, over plain HTTP: straight to the new one. Its ACME path stays
# open so the old certificate can still renew while links to it are out there.
server {
    listen 80;
    listen [::]:80;
    server_name balast.xyz www.balast.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://tidewell.live$request_uri;
    }
}

# www redirects to the apex so there is one canonical host, one cookie scope
# and one URL in every link anyone ever shares.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tidewell.live;

    ssl_certificate     /etc/letsencrypt/live/tidewell.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tidewell.live/privkey.pem;

    return 301 https://tidewell.live$request_uri;
}

# Confusable spellings belong to us and 301 here. An unowned confusable is a
# phishing domain someone else gets to point at a wallet drainer. tidewall.live
# — the misspelling already made once in conversation — is the first to buy.
#
# server {
#     listen 443 ssl http2;
#     server_name tidewall.live www.tidewall.live;
#     ssl_certificate     /etc/letsencrypt/live/tidewall.live/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/tidewall.live/privkey.pem;
#     return 301 https://tidewell.live$request_uri;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tidewell.live;

    ssl_certificate     /etc/letsencrypt/live/tidewell.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tidewell.live/privkey.pem;

    # No third-party scripts: fonts are self-hosted by next/font and every
    # number comes from our own API (§4 — no third-party price API).
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next.js fingerprints these, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # P1: the websocket the indexer's ticks arrive on (§4.4). Its own block,
    # before /api/, because it needs the Upgrade headers and a read timeout
    # long enough to survive a quiet chain — a proxy that drops the socket
    # every 60s turns the push stream into a reconnect loop.
    location = /api/stream {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        # Buffering a stream defeats the point of streaming it.
        proxy_buffering off;
    }

    # P1: the indexer-backed API. Never cached — every response carries the
    # indexer's lag, and a cached lag figure is a lie about how fresh the
    # numbers are (§7).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Stored token logos: images, not figures, so the no-store rule above
    # does not apply — the API sends its own day-long Cache-Control, and a
    # board of fifty badges should not refetch fifty images on every visit.
    location ^~ /api/logo/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;   # P1 websocket
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

