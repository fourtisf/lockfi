# The old domain over HTTPS: every balast.xyz URL 301s to the same path on
# tidewell.live (§19), so links already shared keep working.
#
# Installed by deploy/switch-domain.sh and deploy/deploy.sh only while the
# balast.xyz certificate exists on the box — nginx will not start with an
# ssl_certificate that points at a missing file. Port 80 for the old name is
# handled in deploy/nginx.conf.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name balast.xyz www.balast.xyz;

    ssl_certificate     /etc/letsencrypt/live/balast.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balast.xyz/privkey.pem;

    return 301 https://tidewell.live$request_uri;
}
